<!DOCTYPE html>
<html lang="en">
    <head>
		<meta charset="utf-8">
		<title>Visor continental | Junto al púlsar</title>
		<link href="src/style.css" type="text/css" rel="stylesheet">
    </head>
    <body>
      	<script type="module" src="/src/main.ts"></script>

		<button id="cameraButton">Encender cámara</button>

		<video id="camera" autoplay playsinline></video>
		<canvas id="three"></canvas>
		<div id="debug">
			<p id="gps">
				GPS:
			</p>
			<p id="date">
				Date:
			</p>
		</div>

		<div id="credits">
			<p>
				Idea original Javier Ramos Ortega 2026. v0.1
			</p>
		</div>

		<label for="start-time">Start time</label>
		<input
		type="time"
		id="start-time"
		name="startTime"
		value="09:00"
		>

		<div class="fov-control">
			<label for="fov">FOV</label>
			<input
				type="range"
				id="fov"
				min="30"
				max="90"
				value="60"
				step="10"
			>
			<span id="fov-value">75°</span>
		</div>

    </body>
</html>
